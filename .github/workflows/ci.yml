---
name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ github.repository }} with Idris2 latest (${{ matrix.cg }})
    runs-on: ubuntu-latest
    env:
      PACK_DIR: /root/.pack
    strategy:
      fail-fast: false
      matrix:
        cg: [chez, racket, refc, node]
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install node
        if: matrix.cg == 'node'
        run: apt-get update && apt-get install -y nodejs
      - name: Install Racket
        if: matrix.cg == 'racket'
        run: apt-get update && apt-get install -y racket
      - name: Build log4types-core
        run: pack --no-prompt --cg ${{ matrix.cg }} install log4types-core
      - name: Test log4types-core
        run: pack --no-prompt --cg ${{ matrix.cg }} test log4types-core
      - name: Build log4types
        run: pack --no-prompt --cg ${{ matrix.cg }} install log4types
      - name: Test log4types
        run: pack --no-prompt --cg ${{ matrix.cg }} test log4types
      - name: Build log4types-json
        run: pack --no-prompt --cg ${{ matrix.cg }} install log4types-json
      - name: Test log4types-json
        # upstream idris2 refc bug: casts from String miscompile (JSON.parse triggers this)
        if: matrix.cg != 'refc'
        run: pack --no-prompt --cg ${{ matrix.cg }} test log4types-json
